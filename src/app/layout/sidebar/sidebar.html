<aside
  (click)="layout.toggleSidebar()"
  [title]="layout.sidebarCollapsed() ? 'Click to expand' : 'Click to collapse'"
  class="hidden md:flex md:flex-col shrink-0 cursor-pointer border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 h-[calc(100vh-3.5rem)] sticky top-14 overflow-y-auto transition-[width] duration-200"
  [class.w-64]="!layout.sidebarCollapsed()"
  [class.w-16]="layout.sidebarCollapsed()"
>
  <nav class="flex-1 px-2.5 py-4 space-y-1">
    @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        (click)="$event.stopPropagation()"
        routerLinkActive
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: item.path === '/' || item.path === '/oltp' }"
        [title]="layout.sidebarCollapsed() ? item.label : ''"
        class="relative flex items-center gap-3 rounded-lg px-2.5 py-2 text-sm font-medium transition-colors cursor-pointer"
        [class]="rla.isActive
          ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-400'
          : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
      >
        @if (rla.isActive) {
          <span class="absolute -left-2.5 top-1.5 bottom-1.5 w-1 rounded-r-full bg-indigo-600"></span>
        }
        <app-icon [name]="item.icon" [size]="17" class="shrink-0" />
        @if (!layout.sidebarCollapsed()) {
          <span class="truncate">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  @if (!layout.sidebarCollapsed()) {
    <div class="border-t border-slate-200 dark:border-slate-800 px-4 py-3 text-xs text-slate-400">
      AiTDP Queries · Phase 1
    </div>
  }
</aside>
